name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Godot 4.7 (headless Linux)
        run: |
          curl -fsSL -o godot.zip https://github.com/godotengine/godot-builds/releases/download/4.7-stable/Godot_v4.7-stable_linux.x86_64.zip
          unzip -q godot.zip
          mv Godot_v4.7-stable_linux.x86_64 godot
          chmod +x godot

      - name: Run unit tests (tests/run_tests.gd)
        run: ./godot --headless --script res://tests/run_tests.gd --quit

      - name: Smoke level (tests/smoke_level.gd)
        run: ./godot --headless --script res://tests/smoke_level.gd

      - name: Smoke main menu (tests/smoke_main_menu.gd)
        run: ./godot --headless --script res://tests/smoke_main_menu.gd

      - name: Smoke Endless Mode (tests/smoke_endless.gd)
        run: ./godot --headless --script res://tests/smoke_endless.gd

      - name: Smoke rapid taps (tests/smoke_rapid_taps.gd)
        run: ./godot --headless --script res://tests/smoke_rapid_taps.gd

      - name: Smoke help overlay (tests/smoke_help.gd)
        run: ./godot --headless --script res://tests/smoke_help.gd

      - name: Smoke Reserve taps (tests/smoke_reserve.gd)
        run: ./godot --headless --script res://tests/smoke_reserve.gd

      - name: Smoke live stars (tests/smoke_stars.gd)
        run: ./godot --headless --script res://tests/smoke_stars.gd

      - name: Smoke in-game settings (tests/smoke_settings.gd)
        run: ./godot --headless --script res://tests/smoke_settings.gd

      - name: Board layout regression (tests/regression_board_layout.gd)
        run: ./godot --headless --script res://tests/regression_board_layout.gd

      - name: Generation load-time probe (tests/probe_generation.gd)
        run: ./godot --headless --script res://tests/probe_generation.gd

      - name: HUD bounds regression, portrait + landscape (tests/repro_hud_bounds.gd)
        run: ./godot --headless --script res://tests/repro_hud_bounds.gd

      - name: Board capture regression (tests/repro_board_capture.gd)
        run: ./godot --headless --script res://tests/repro_board_capture.gd
